<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#02080a">
<title>Radar Sonar Acustico</title>
<style>
  :root {
    --bg: #02080a;
    --panel: #061418;
    --green: #39ff88;
    --cyan: #19f0ff;
    --dim: #1d6b55;
    --warn: #ff5a5a;
    color-scheme: dark;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--green);
    font-family: "SF Mono", ui-monospace, Menlo, Consolas, monospace; overflow: hidden; }
  body { display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); }

  header { text-align: center; padding: 10px 12px 0; }
  h1 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: .12em; color: var(--cyan);
       text-shadow: 0 0 10px rgba(25,240,255,.6); }
  #status { margin-top: 4px; font-size: 11px; color: var(--dim); min-height: 14px; }
  #status.err { color: var(--warn); }

  /* Area del radar: il canvas occupa il quadrato massimo disponibile */
  main { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 8px; }
  canvas { width: min(100%, 100%); height: 100%; max-width: 100%; max-height: 100%;
           aspect-ratio: 1 / 1; border-radius: 14px;
           box-shadow: 0 0 0 1px var(--dim), 0 0 40px rgba(57,255,136,.25), inset 0 0 40px rgba(57,255,136,.12); }

  /* Pannello di controllo */
  footer { background: var(--panel); border-top: 1px solid var(--dim);
           padding: 14px 16px calc(14px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 12px; }
  .row { display: flex; align-items: center; gap: 12px; }
  .row label { font-size: 12px; color: var(--dim); min-width: 64px; }
  .row output { min-width: 84px; text-align: right; font-size: 14px; color: var(--cyan); }
  input[type=range] { flex: 1; accent-color: var(--green); height: 28px; }
  #toggle { width: 100%; padding: 14px; font: 600 16px/1 inherit; font-family: inherit; letter-spacing: .15em;
            color: var(--bg); background: var(--green); border: 0; border-radius: 10px;
            box-shadow: 0 0 18px rgba(57,255,136,.5); cursor: pointer; }
  #toggle.on { background: var(--warn); box-shadow: 0 0 18px rgba(255,90,90,.5); }
  #toggle:focus-visible, input:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
  select { flex: 1; background: #02080a; color: var(--cyan); border: 1px solid var(--dim);
           border-radius: 8px; padding: 8px; font: inherit; font-size: 13px; }
  #meter { font-size: 11px; color: var(--dim); text-align: center; min-height: 14px; }
</style>
</head>
<body>

<header>
  <h1>RADAR SONAR ACUSTICO</h1>
  <div id="status">Pronto. Tieni basso il volume del telefono e non avvicinarlo all’orecchio.</div>
</header>

<main><canvas id="radar"></canvas></main>

<footer>
  <button id="toggle" type="button">START</button>
  <div class="row">
    <label for="freq">Frequenza</label>
    <input id="freq" type="range" min="18000" max="22000" step="100" value="20000">
    <output id="freqOut" for="freq">20000 Hz</output>
  </div>
  <div class="row">
    <label for="pow">Potenza</label>
    <input id="pow" type="range" min="1" max="10" step="1" value="3">
    <output id="powOut" for="pow">3/10</output>
  </div>
  <div class="row">
    <label for="sens">Soglia</label>
    <input id="sens" type="range" min="2" max="20" step="1" value="8">
    <output id="sensOut" for="sens">8 dB</output>
  </div>
  <div class="row">
    <label for="micpos">Microfono</label>
    <select id="micpos">
      <option value="down" selected>In basso (tipico)</option>
      <option value="up">In alto</option>
      <option value="left">A sinistra</option>
      <option value="right">A destra</option>
    </select>
  </div>
  <div id="meter">—</div>
</footer>

<script>
"use strict";

/* =========================================================
 *  CONFIGURAZIONE
 * ========================================================= */
const FFT_SIZE      = 4096;     // risoluzione ≈ 11.7 Hz/bin a 48 kHz
const SWEEP_PERIOD  = 4000;     // ms per un giro completo
const WARMUP_MS     = 1200;     // tempo di calibrazione del baseline
const SIDE_FROM     = 3;        // bin (rispetto alla portante) dove parte la banda Doppler
const SIDE_TO       = 14;       // bin dove finisce
const BASE_ALPHA    = 0.02;     // velocità di adattamento del baseline (EMA)
const GAIN_MIN      = 0.01;     // volume di emissione minimo (potenza 1)
const MAX_GAIN      = 0.15;     // LIMITE DURO del volume di emissione (potenza 10)
const AUTO_STOP_MS  = 10 * 60 * 1000;   // spegnimento automatico dopo 10 minuti
const MAX_RANGE     = 2;        // metri rappresentati dal bordo del radar (stima)
const FADE_MS       = 900;      // dissolvenza dello spicchio dopo l’ultimo eco
const FAN_HALF      = 0.62;     // semi-apertura del ventaglio (rad, ≈ 36° → 71° totali)

/* =========================================================
 *  STATO
 * ========================================================= */
const $ = id => document.getElementById(id);
const canvas = $("radar"), ctx2d = canvas.getContext("2d");
const btn = $("toggle"), freqEl = $("freq"), sensEl = $("sens");

let actx = null, osc = null, outGain = null, analyser = null, micStream = null, micSrc = null;
let spec = null;                 // Float32Array dello spettro (dB)
let running = false;
let startTime = 0;
let baseSide = null, baseCarrier = null;   // baseline adattivi
let target = { r: 0, a: 0, t: -1e9 };   // ultimo bersaglio: distanza (m), angolo (rad), istante
let stereo = false, anL = null, anR = null, specL = null, specR = null, balance = 0;
let size = 300;

/* =========================================================
 *  UI
 * ========================================================= */
function setStatus(msg, err) { const s = $("status"); s.textContent = msg; s.className = err ? "err" : ""; }

freqEl.addEventListener("input", () => {
  const f = +freqEl.value;
  $("freqOut").textContent = f + " Hz";
  if (osc) osc.frequency.setTargetAtTime(f, actx.currentTime, 0.05);  // cambio liscio, senza click
  baseSide = baseCarrier = null; startTime = performance.now();      // ricalibra
});
// Potenza 1..10 -> gain tra GAIN_MIN e MAX_GAIN (mai oltre il limite)
const powEl = $("pow");
const gainFor = v => Math.min(MAX_GAIN, GAIN_MIN + (v - 1) / 9 * (MAX_GAIN - GAIN_MIN));
powEl.addEventListener("input", () => {
  $("powOut").textContent = powEl.value + "/10";
  if (outGain) outGain.gain.setTargetAtTime(gainFor(+powEl.value), actx.currentTime, 0.2);
});
// Se l'app va in background o la pagina viene nascosta, spegne subito il tono
document.addEventListener("visibilitychange", () => { if (document.hidden && running) stop(); });
let autoStopTimer = null, warned = false;

sensEl.addEventListener("input", () => { $("sensOut").textContent = sensEl.value + " dB"; });
btn.addEventListener("click", () => (running ? stop() : start()));

/* =========================================================
 *  AUDIO: START / STOP
 * ========================================================= */
async function start() {
  if (!warned) {
    if (!confirm("ATTENZIONE: il telefono emette un tono ad alta frequenza.\n\n" +
                 "• Tieni il volume del telefono basso/medio.\n" +
                 "• Non avvicinare lo speaker all’orecchio.\n" +
                 "• Non usare cuffie.\n" +
                 "• Se senti fastidio o fischio, premi STOP.\n\nContinuare?")) return;
    warned = true;
  }
  try {
    // Contesto a 48 kHz: serve per rappresentare tono e spettro fino a 22 kHz
    const AC = window.AudioContext || window.webkitAudioContext;
    actx = new AC({ sampleRate: 48000, latencyHint: "interactive" });
    await actx.resume();                       // necessario su iOS/Safari (dentro al gesto utente)

    // Microfono "grezzo": i filtri vocali del browser eliminerebbero il tono ultrasonico
    micStream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false, channelCount: { ideal: 2 } }
    });

    // Emettitore: oscillatore sinusoidale -> gain -> altoparlante
    osc = actx.createOscillator();
    osc.type = "sine";
    osc.frequency.value = +freqEl.value;
    outGain = actx.createGain();
    outGain.gain.value = 0;
    osc.connect(outGain).connect(actx.destination);
    osc.start();
    outGain.gain.setTargetAtTime(gainFor(+powEl.value), actx.currentTime, 0.6);   // fade-in lento (~2 s)
    clearTimeout(autoStopTimer); autoStopTimer = setTimeout(stop, AUTO_STOP_MS);

    // Ricevitore: microfono -> analyser (NON collegato alle casse: niente feedback)
    analyser = actx.createAnalyser();
    analyser.fftSize = FFT_SIZE;
    analyser.smoothingTimeConstant = 0.3;
    analyser.minDecibels = -140; analyser.maxDecibels = 0;
    micSrc = actx.createMediaStreamSource(micStream);
    micSrc.connect(analyser);
    spec = new Float32Array(analyser.frequencyBinCount);

    // Gli analyser vanno collegati a un nodo muto, altrimenti alcuni browser non li aggiornano
    const mute = actx.createGain(); mute.gain.value = 0; mute.connect(actx.destination);
    analyser.connect(mute);

    // Stereo: solo se il telefono fornisce davvero 2 canali (molti sono mono)
    stereo = (micStream.getAudioTracks()[0].getSettings().channelCount || 1) >= 2;
    if (stereo) {
      const split = actx.createChannelSplitter(2);
      anL = actx.createAnalyser(); anR = actx.createAnalyser();
      for (const a of [anL, anR]) { a.fftSize = FFT_SIZE; a.smoothingTimeConstant = 0.3;
        a.minDecibels = -140; a.maxDecibels = 0; a.connect(mute); }
      micSrc.connect(split); split.connect(anL, 0); split.connect(anR, 1);
      specL = new Float32Array(anL.frequencyBinCount); specR = new Float32Array(anR.frequencyBinCount);
    }
    balance = 0;

    running = true; startTime = performance.now(); baseSide = baseCarrier = null; target.t = -1e9;
    btn.textContent = "STOP"; btn.classList.add("on");
    setStatus("Calibrazione… tieni fermo il telefono (" + Math.round(actx.sampleRate) + " Hz)");
  } catch (e) {
    console.error(e);
    setStatus(e.name === "NotAllowedError" ? "Permesso microfono negato." : "Errore audio: " + e.message, true);
    stop();
  }
}

function stop() {
  running = false; clearTimeout(autoStopTimer);
  if (outGain) outGain.gain.value = 0;   // silenzio immediato
  try { if (osc) osc.stop(); } catch (_) {}
  if (micStream) micStream.getTracks().forEach(t => t.stop());
  if (actx && actx.state !== "closed") actx.close();
  actx = osc = outGain = analyser = micStream = micSrc = anL = anR = null; stereo = false;
  btn.textContent = "START"; btn.classList.remove("on");
  $("meter").textContent = "—";
}

/* =========================================================
 *  DSP: ANALISI DEL SEGNALE DI RITORNO
 *  - Portante: livello (dB) del tono emesso, così come rientra nel microfono.
 *  - Banda Doppler: energia ai lati della portante. Un oggetto in movimento
 *    riflette il tono con un piccolo shift di frequenza (pochi Hz/decine di Hz).
 *  - Eco: variazioni rapide del livello della portante (riflessi che si
 *    sommano o sottraggono al segnale diretto).
 *  Entrambe vengono confrontate con un baseline adattivo (media mobile
 *  esponenziale): si rileva quindi la VARIAZIONE, non il valore assoluto.
 * ========================================================= */
// Energia media (dB) nelle bande laterali della portante, per un dato spettro
function bandDb(s, k0) {
  let p = 0, n = 0;
  for (let d = SIDE_FROM; d <= SIDE_TO; d++) { p += Math.pow(10, s[k0 - d] / 10) + Math.pow(10, s[k0 + d] / 10); n += 2; }
  return 10 * Math.log10(p / n + 1e-20);
}

function analyse(now) {
  analyser.getFloatFrequencyData(spec);
  const binHz = actx.sampleRate / FFT_SIZE;
  const k0 = Math.round(+freqEl.value / binHz);

  // Livello portante: massimo nei bin centrali
  let carrier = -200;
  for (let k = k0 - 2; k <= k0 + 2; k++) carrier = Math.max(carrier, spec[k]);

  // Energia media (potenza lineare -> dB) nelle due bande laterali
  let p = 0, n = 0;
  for (let d = SIDE_FROM; d <= SIDE_TO; d++) {
    p += Math.pow(10, spec[k0 - d] / 10) + Math.pow(10, spec[k0 + d] / 10); n += 2;
  }
  const side = 10 * Math.log10(p / n + 1e-20);

  // Baseline: parte dal primo campione, poi segue lentamente
  if (baseSide === null) { baseSide = side; baseCarrier = carrier; }
  const dSide = side - baseSide;
  const dCar  = Math.abs(carrier - baseCarrier);
  const strength = Math.max(dSide, dCar);          // dB sopra il baseline
  const warm = now - startTime < WARMUP_MS;
  const thr = +sensEl.value;

  // Aggiorna il baseline solo se non c'è un evento (così l'eco non viene "assorbito")
  if (warm || strength < thr * 0.6) {
    const a = warm ? 0.2 : BASE_ALPHA;
    baseSide += (side - baseSide) * a;
    baseCarrier += (carrier - baseCarrier) * a;
  }

  // Direzione: se i canali sono due, la differenza di livello L/R sposta lo spicchio (-1..+1)
  if (stereo && anL && anR) {
    anL.getFloatFrequencyData(specL); anR.getFloatFrequencyData(specR);
    const b = Math.max(-1, Math.min(1, (bandDb(specR, k0) - bandDb(specL, k0)) / 6));
    balance += (b - balance) * 0.2;
  }

  $("meter").textContent = "Portante " + carrier.toFixed(0) + " dB · Δ " + strength.toFixed(1) + " dB" +
                           (warm ? " · calibrazione" : "");
  if (!warm && $("status").textContent.startsWith("Calibrazione"))
    setStatus("Scansione attiva. Muovi una mano davanti al telefono.");

  return { strength, thr, warm };
}

/* =========================================================
 *  RADAR: DISEGNO
 *  Nota: con un tono continuo la distanza è solo una stima dall'intensità
 *  dell'eco, e la direzione è quella del microfono (più un lieve
 *  spostamento L/R se il telefono ha due canali).
 * ========================================================= */
// Angolo (canvas: 0 = destra, π/2 = basso) in cui si trova il microfono
function micAngle() {
  return { down: Math.PI / 2, up: -Math.PI / 2, left: Math.PI, right: 0 }[$("micpos").value];
}

function resize() {
  const dpr = window.devicePixelRatio || 1;
  size = Math.floor(canvas.getBoundingClientRect().width) || 300;
  canvas.width = canvas.height = Math.floor(size * dpr);
  ctx2d.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener("resize", resize);

function draw(now) {
  const c = ctx2d, W = size, R = W / 2 - 2, H = FAN_HALF;
  const ma = micAngle();
  const dx = Math.cos(ma), dy = Math.sin(ma);
  // Origine del ventaglio = il telefono, sul bordo opposto alla direzione del microfono
  const ox = W / 2 - dx * R * 0.92, oy = W / 2 - dy * R * 0.92;
  const Rf = R * 1.84;                                   // raggio del ventaglio

  // ---- Analisi: aggiorna il bersaglio quando c'è un eco
  if (running && analyser) {
    const r = analyse(now);
    if (!r.warm && r.strength > r.thr) {
      // Distanza stimata (euristica): eco forte = vicino, ~25 dB per ogni decuplo di distanza
      const m = Math.min(MAX_RANGE, Math.max(0.1, 0.15 * Math.pow(10, (25 - r.strength) / 25)));
      const a = balance * H * 0.8;                       // angolo locale (0 = asse del microfono)
      const live = now - target.t < FADE_MS;            // se già attivo interpola, niente scatti
      target.r = live ? target.r + (m - target.r) * 0.25 : m;
      target.a = live ? target.a + (a - target.a) * 0.25 : a;
      target.t = now;
    }
  }

  // ---- Sfondo
  c.fillStyle = "#02080a"; c.fillRect(0, 0, W, W);

  // Tutto il disegno avviene in coordinate locali: origine = telefono, asse x = direzione del microfono
  c.save(); c.translate(ox, oy); c.rotate(ma);
  const label = (txt, x, y, col) => {                    // testo sempre dritto
    c.save(); c.translate(x, y); c.rotate(-ma); c.fillStyle = col;
    c.font = "11px monospace"; c.textAlign = "center"; c.fillText(txt, 0, 0); c.restore();
  };

  // Ventaglio (clip) con fondo sfumato
  c.beginPath(); c.moveTo(0, 0); c.arc(0, 0, Rf, -H, H); c.closePath();
  const bg = c.createRadialGradient(0, 0, 0, 0, 0, Rf);
  bg.addColorStop(0, "rgba(57,255,136,.14)"); bg.addColorStop(1, "rgba(57,255,136,.03)");
  c.fillStyle = bg; c.fill(); c.clip();

  // Archi di distanza e raggi
  c.strokeStyle = "rgba(57,255,136,.35)"; c.lineWidth = 1;
  for (let i = 1; i <= 4; i++) { c.beginPath(); c.arc(0, 0, Rf * i / 4, -H, H); c.stroke(); }
  c.strokeStyle = "rgba(57,255,136,.2)"; c.beginPath();
  for (const k of [-1, -0.5, 0, 0.5, 1]) { c.moveTo(0, 0); c.lineTo(Math.cos(k * H) * Rf, Math.sin(k * H) * Rf); }
  c.stroke();
  for (let i = 1; i <= 4; i++) label((i * MAX_RANGE / 4).toFixed(1) + " m", Rf * i / 4 - 22, 12, "rgba(57,255,136,.6)");

  // Linea di scansione che oscilla avanti e indietro nel ventaglio, con scia
  const ph = (now % 3200) / 3200 * Math.PI * 2, sw = H * Math.sin(ph), sg = Math.cos(ph) >= 0 ? 1 : -1;
  for (let i = 0; i < 20; i++) {
    const a1 = sw - sg * i * 0.03, a0 = sw - sg * (i + 1) * 0.03;
    c.fillStyle = "rgba(57,255,136," + (0.22 * (1 - i / 20)).toFixed(3) + ")";
    c.beginPath(); c.moveTo(0, 0); c.arc(0, 0, Rf, Math.min(a0, a1), Math.max(a0, a1)); c.closePath(); c.fill();
  }
  c.strokeStyle = "#7dffb0"; c.lineWidth = 2; c.shadowColor = "#39ff88"; c.shadowBlur = 10;
  c.beginPath(); c.moveTo(0, 0); c.lineTo(Math.cos(sw) * Rf, Math.sin(sw) * Rf); c.stroke(); c.shadowBlur = 0;

  // Eco: "fetta" piena dal centro fino alla distanza stimata + fascia luminosa sull'arco
  const al = Math.max(0, 1 - (now - target.t) / FADE_MS);
  if (al > 0) {
    const rr = Math.min(1, target.r / MAX_RANGE) * Rf;
    // Mono: direzione non nota dentro al ventaglio -> si illumina tutta l'apertura. Stereo: fetta stretta.
    const w = stereo ? 0.22 : H, a0 = Math.max(-H, target.a - w), a1 = Math.min(H, target.a + w);
    const eg = c.createRadialGradient(0, 0, 0, 0, 0, rr);
    eg.addColorStop(0, "rgba(25,240,255,0)"); eg.addColorStop(1, "rgba(25,240,255," + (0.5 * al).toFixed(2) + ")");
    c.fillStyle = eg; c.beginPath(); c.moveTo(0, 0); c.arc(0, 0, rr, a0, a1); c.closePath(); c.fill();
    c.strokeStyle = "rgba(220,255,255," + al.toFixed(2) + ")"; c.lineWidth = 5; c.lineCap = "round";
    c.shadowColor = "#19f0ff"; c.shadowBlur = 14;
    c.beginPath(); c.arc(0, 0, rr, a0, a1); c.stroke(); c.shadowBlur = 0; c.lineCap = "butt";
    label("≈ " + target.r.toFixed(1) + " m", Math.max(30, rr - 28), Math.sin((a0 + a1) / 2) * rr * 0.5, "rgba(220,255,255," + al.toFixed(2) + ")");
  }
  c.restore();

  // Contorno del ventaglio e punto d'origine (il telefono)
  c.save(); c.translate(ox, oy); c.rotate(ma);
  c.strokeStyle = "rgba(57,255,136,.8)"; c.lineWidth = 1.5; c.shadowColor = "#39ff88"; c.shadowBlur = 10;
  c.beginPath(); c.moveTo(0, 0); c.arc(0, 0, Rf, -H, H); c.closePath(); c.stroke(); c.shadowBlur = 0;
  c.fillStyle = "#39ff88"; c.beginPath(); c.arc(0, 0, 5, 0, Math.PI * 2); c.fill();
  c.restore();

  requestAnimationFrame(draw);
}

resize();
requestAnimationFrame(draw);
</script>
</body>
</html>
